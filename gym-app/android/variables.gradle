ext {
    minSdkVersion = 26
    compileSdkVersion = 36
    // Play requires the target API to stay within one year of the latest Android
    // release. Android 16 = API 36; from Aug 30 2026 an app still on 35 cannot
    // publish updates at all. Behaviour changes this opts into, and how each is
    // handled, are documented in AndroidManifest.xml.
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}